<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Progress Stat</title>
<style>
:root{--bg:#000;--card:#0b0b0b;--row:#1a1a1a;--text:#fff;--muted:#a3a3a3;--edge:rgba(255,255,255,.85);--soft:rgba(255,255,255,.22);--red:#9b2c2c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{height:100%}
body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--text);background:var(--bg)}
header{padding:28px 20px 8px;text-align:center;position:relative}
h1{margin:0;font-size:13px;letter-spacing:.3em;color:var(--muted)}
h2.agent{margin:6px 0 0;font-size:clamp(22px,4vw,34px);letter-spacing:.04em}
.switch{position:absolute;top:22px;right:20px;border:1px solid var(--edge);background:transparent;color:var(--text);border-radius:10px;padding:8px 14px;font-weight:700;font-size:12px;letter-spacing:.08em;cursor:pointer}
.switch:hover{background:#fff;color:#000}
.note{max-width:1200px;margin:10px auto 0;padding:0 20px;text-align:center;font-size:13px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px;padding:16px 20px 100px;max-width:1200px;margin:auto}
.card{background:var(--card);border:1px solid var(--edge);border-radius:20px;padding:18px}
.card h3{margin:0 0 12px;font-size:15px;letter-spacing:.15em;color:var(--muted)}
table{width:100%;border-collapse:separate;border-spacing:0 6px}
td,th{padding:9px 12px;text-align:left;font-size:14px}
th{font-size:11px;letter-spacing:.1em;color:var(--muted);font-weight:600;padding-top:0;padding-bottom:0}
tbody td{background:var(--row)}tbody td:first-child{border-radius:10px 0 0 10px}tbody td:last-child{border-radius:0 10px 10px 0}
td.v{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.yes,.no{display:inline-block;padding:3px 12px;border-radius:99px;font-weight:800;font-size:13px}
.yes{background:#22c55e;color:#04210f}.no{background:var(--red);color:#fff}
tr.miss td,tr.red td{background:var(--red);color:#fff}
tr.orange td{background:#f97316;color:#000}
.edit{width:70px;text-align:right;font:inherit;font-weight:700;color:#fff;background:#000;border:1px solid var(--edge);border-radius:8px;padding:3px 6px}
.edit[readonly]{border-color:var(--soft);cursor:pointer}
.fab{position:fixed;right:max(20px,env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;border:1px solid #000;background:#fff;color:#000;font-size:26px;cursor:pointer;box-shadow:0 8px 28px rgba(255,255,255,.18)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;padding:16px;z-index:5}
.modal.on{display:flex}
#pwModal{z-index:30}
#picker{z-index:20;background:#000;overflow:auto;align-items:flex-start}
.panel{background:var(--card);border:1px solid var(--edge);border-radius:20px;width:min(1100px,100%);max-height:88vh;display:flex;flex-direction:column;padding:16px;color:#fff}
.bar{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-bottom:10px;flex-wrap:wrap}
.bar b{font-size:15px}.bar small{opacity:.75}
.bar button,.pwbtns button{border:1px solid var(--edge);border-radius:10px;padding:8px 14px;font-weight:700;cursor:pointer;background:#fff;color:#000;margin-left:6px}
.bar button#clear,.bar button#export,.bar button#csExport,.bar button#csClear,.bar button.ghostb,.pwbtns button.ghost{background:transparent;color:#fff}
.sheet{overflow:auto;border-radius:10px;background:#fff}
.sheet table{border-collapse:collapse;border-spacing:0;width:max-content;color:#111}
.sheet td,.sheet th{border:1px solid #d4d4d4;padding:4px 8px;font-size:12.5px;min-width:90px;height:26px;white-space:nowrap;background:#fff}
.sheet th{background:#eee;color:#111;text-align:center;position:sticky;top:0}
.sheet td.n{background:#eee;color:#111;min-width:34px;text-align:center;position:sticky;left:0}
.sheet tr:first-of-type td:not(.n){font-weight:700;background:#f5f5f5}
.sheet td:focus{outline:2px solid #000;outline-offset:-2px}
.pick{width:min(760px,100%);margin:6vh auto 40px;text-align:center}
.pick h2{margin:10px 0 6px;font-size:clamp(24px,5vw,36px);letter-spacing:.04em}
.grp{margin-bottom:22px;text-align:left}
.grp h4{margin:0 0 10px;font-size:12px;letter-spacing:.2em;color:var(--muted);border-bottom:1px solid var(--soft);padding-bottom:8px}
.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.names button{font:inherit;font-weight:700;font-size:14px;text-align:left;color:#fff;background:var(--card);border:1px solid var(--edge);border-radius:12px;padding:13px 14px;cursor:pointer}
.names button:hover{background:#fff;color:#000}
#lb,#ts,#csat{z-index:20;background:#000;overflow:auto;align-items:flex-start}
.lbwrap{width:min(1200px,100%);margin:3vh auto 40px}
.lbtop{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
.lbtop h2{margin:0;font-size:clamp(22px,4vw,32px);letter-spacing:.06em}
.lbsec{grid-column:1/-1;font-size:12px;letter-spacing:.2em;color:var(--muted);border-bottom:1px solid var(--soft);padding-bottom:8px;margin-top:8px}
.lbgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px;padding:14px 0}
.lbgrid td:first-child{width:36px;text-align:center}
#tsGrid td:first-child{white-space:nowrap}
/* Background logo: put bg.png next to index.html. Change --bgop to make it fainter (lower) or stronger (higher). */
:root{--bgop:.15}
body::before,#picker::before,#lb::before,#ts::before,#csat::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:url("bg.png") center/min(75vmin,640px) no-repeat;opacity:var(--bgop)}
.switch.left{left:20px;right:auto}
/* Attention shake for the SWITCH CSAT VIEW buttons: shakes on load, then every 1.5s */
@keyframes shake{0%{transform:translateX(0)}4%{transform:translateX(-6px)}8%{transform:translateX(6px)}12%{transform:translateX(-6px)}16%{transform:translateX(6px)}20%{transform:translateX(-3px)}24%{transform:translateX(3px)}28%,100%{transform:translateX(0)}}
#toCsat,#toCsat2{animation:shake 1.5s ease-in-out infinite}
#toCsat:hover,#toCsat2:hover{animation:none}
@media (prefers-reduced-motion:reduce){#toCsat,#toCsat2{animation:none}}
#csModal{z-index:25}
#csat .lbwrap{padding-bottom:90px}
.csTitle{margin:6px 0 4px;text-align:center;font-size:clamp(22px,4vw,32px);letter-spacing:.06em}
.csgrid{display:grid;gap:18px;padding:14px 0}
.scroll{overflow-x:auto}
.cst{min-width:640px}.cst.wide{min-width:980px}
.cst th{text-align:center;vertical-align:bottom;padding:0 12px 6px;white-space:normal;min-width:90px;line-height:1.3}
.cst th:first-child{min-width:170px}
.cst td,.cst td.v{text-align:center}
.cst td:first-child{white-space:nowrap}
.cst td.bad{background:var(--red);color:#fff}
.cst tr.gt td{background:#fff;color:#000;font-weight:800}
.cst tr.gt td.bad{background:var(--red);color:#fff}
.tg{display:block;font-size:10px;letter-spacing:.12em;opacity:.7;font-weight:600}
.lbbtns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-bottom:26px}
.lbbtn{font:inherit;font-weight:800;font-size:15px;letter-spacing:.16em;color:#000;background:#fff;border:1px solid #fff;border-radius:12px;padding:14px 28px;cursor:pointer}
.lbbtn:hover{background:#000;color:#fff;border-color:var(--edge)}
.empty{color:var(--muted);font-size:14px;padding:10px 0}
#pwIn{width:100%;font:inherit;font-size:16px;color:#fff;background:#000;border:1px solid var(--edge);border-radius:10px;padding:11px 12px;margin:12px 0 6px}
#pwErr{min-height:20px;font-size:13px;color:#ff6b6b;font-weight:700}
.pwbtns{display:flex;justify-content:flex-end;margin-top:8px}
@media(max-width:560px){.switch{position:static;margin-bottom:10px}}
</style></head><body>
<header>
<button class="switch left" id="toCsat">SWITCH CSAT VIEW</button>
<button class="switch" id="switch">SWITCH AGENT</button>
<h1>PROGRESS STAT</h1><h2 class="agent" id="agent"></h2>
</header>
<div class="note" id="note"></div>
<div class="grid">
<div class="card"><h3>MTD TABLE</h3><table id="mtd"></table></div>
<div class="card"><h3>SALES TABLE</h3><table id="sales"></table></div>
<div class="card"><h3>KPI TABLE</h3><table id="kpi"></table></div>
</div>
<button class="fab" id="fab" title="Open data sheet" aria-label="Open data sheet">&#128214;</button>

<div class="modal" id="lb"><div class="lbwrap">
<div class="lbtop"><h2>LEADERBOARDS</h2><button class="switch" id="lbBack" style="position:static">BACK</button></div>
<div class="lbgrid" id="lbGrid"></div>
</div></div>

<div class="modal" id="ts"><div class="lbwrap">
<div class="lbtop"><h2>TEAM SCORES</h2><button class="switch" id="tsBack" style="position:static">BACK</button></div>
<div class="note" id="tsNote" style="text-align:left;padding:0;margin:0 0 4px"></div>
<div class="lbgrid" id="tsGrid"></div>
</div></div>

<div class="modal on" id="picker"><button class="switch left" id="toCsat2" style="position:fixed;top:calc(22px + env(safe-area-inset-top,0px));left:20px">SWITCH TO HOURLY CSAT</button><div class="pick">
<h1>PROGRESS STAT</h1>
<h2>STEELERS MTD</h2>
<div class="lbbtns"><button class="lbbtn" id="lbBtn">VIEW LEADERBOARDS</button><button class="lbbtn" id="tsBtn">VIEW TEAM SCORES</button></div>
<div id="groups"></div>
</div></div>

<div class="modal" id="csat"><div class="lbwrap">
<div class="lbtop"><button class="switch" id="csBack" style="position:static">SWITCH PROGRESS VIEW</button></div>
<h2 class="csTitle">CSAT VIEW</h2>
<div class="note" id="csNote"></div>
<div class="csgrid" id="csTables"></div>
<button class="fab" id="csFab" title="Open data sheet" aria-label="Open data sheet">&#128214;</button>
</div></div>

<div class="modal" id="csModal"><div class="panel">
<div class="bar"><div><b>CSAT data</b> <small id="csHint"></small></div>
<div><button id="csAddRows" class="ghostb">+ Rows</button><button id="csAddCols" class="ghostb">+ Cols</button><button id="csT1">Surveys</button><button id="csT2" class="ghostb">Calls</button><button id="csExport" title="Download csat.json to publish for everyone">Export data</button><button id="csClear">Clear</button><button id="csClose">Done</button></div></div>
<div class="sheet" id="csSheet"></div></div></div>

<div class="modal" id="pwModal"><div class="panel" style="width:min(380px,100%)">
<b>Password required</b>
<small style="opacity:.75;margin-top:4px">Enter the password to edit or paste data.</small>
<input id="pwIn" type="password" placeholder="Password" autocomplete="off">
<div id="pwErr"></div>
<div class="pwbtns"><button class="ghost" id="pwCancel">Cancel</button><button id="pwOk">Unlock</button></div>
</div></div>

<div class="modal" id="modal"><div class="panel">
<div class="bar"><div><b>Data sheet</b> <small>Click cell A1 and paste (Ctrl+V); pasting at A1 replaces all old data. Headers in row 1</small></div>
<div><button id="addRows" class="ghostb">+ Rows</button><button id="addCols" class="ghostb">+ Cols</button><button id="export" title="Download data.json to publish for all agents">Export data</button><button id="clear">Clear</button><button id="close">Done</button></div></div>
<div class="sheet" id="sheet"></div></div></div>

<script>
/* ================= CONFIG: edit values here ================= */
// Password is stored as a hash, not plain text. To change it, run in the browser console:
// hash("YourNewPassword") and paste the number below. (Still client-side only: it gates the UI, not the data.)
const PW_HASH=1692183746526809;
const hash=(s,seed=0)=>{let h1=0xdeadbeef^seed,h2=0x41c6ce57^seed;for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677)}
h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return 4294967296*(2097151&h2)+(h1>>>0)};
const CFG={
 takeTarget:.25, vrrRed:.92, passRateTarget:.6, fcrPassTarget:.88, acqTarget:5.85, csatTarget:4.9, p2pTarget:.87, fcrTarget:.85, ahtTarget:920, xferSurveyRed:.55, transferMax:.12,
 defaultDays:{w:22,s:22,a:0,l:0},
 // Incentive: bookings threshold -> payout
 incentive:[[500,1750],[1000,3250],[2000,4750],[3000,5000],[3500,5100],[4000,5250],[4500,5750],[5000,6250],[5500,6500],[6000,7000],[6500,7500],[7000,8000]],
 kicker:{start:7000,rate:.035,fx:60.59},
 // KPI payout bands: minimum percentage -> amount (highest first)
 kpiBands:[[.95,5250],[.9,5000],[.87,4500],[.85,2500],[.8,1975]],
 // KPI weights
 weights:{csat:.2,aht:.25,vrr:.25,p2p:.15,transfer:.05,absence:.05,late:.05}
};
/* ============================================================ */
const GROUPS=[
{label:"TENURED AGENTS",short:"TENURED",key:"t",red:.94,org:.97,names:["Chino Albarracin","Blessy Anne Opamin","Kint Mabayo","Dean John Mawili","Gestoni Cobar"]},
{label:"31-90 DAYS",short:"31-90 DAYS",key:"m",red:.91,org:.93,names:["Rommel Gepitulan","Joann Paler","Carla Lynn Lanada","Archellie Recinto","Dinece Ambra Estella","Julie Luz Baloy","Justine Bustillon","Bill Christian Llevares"]},
{label:"BELOW 30 DAYS",short:"BELOW 30 DAYS",key:"n",red:.87,org:.91,names:["Jade Cabiles","Mark Montano","Jag Vosotros"]}];
const HDR=["Agent Name","Voice Answered","Voice Answered AHT","Voice CSAT","Voice FCR","Voice Agent Resolution","Voice Answered Take Rate (calibrated)","Voice Answered Transfer to Survey % (calibrated)","Voice Handled Transfer % (calibrated)","Status - Pay to Performance","Voice Sentiment Trend Avg","Revenue - Bookings (Post Recoup)","Revenue - ACQ + CROSS (Post Recoup)","Revenue - REN (Post Recoup)"];
const PCT=["voicefcr","voiceagentresolution","voiceansweredtakeratecalibrated","voiceansweredtransfertosurveycalibrated","voicehandledtransfercalibrated","statuspaytoperformance"];
const norm=s=>String(s==null?"":s).toLowerCase().replace(/[^a-z0-9]/g,"");
const AGENTS=GROUPS.flatMap(g=>g.names.map(n=>({name:n,id:norm(n),key:g.key,red:g.red,org:g.org,tag:g.short})));
const $id=id=>document.getElementById(id);
let cur=null,unlocked=false,pwThen=null;
let data=[HDR.slice()],daysAll={},daysPub={},pubTs=0,localTs=0;
try{const d=JSON.parse(localStorage.getItem("ps2_data")||"null");if(d&&d.length)data=d;const k=JSON.parse(localStorage.getItem("ps2_days")||"null");if(k)daysAll=k;localTs=+localStorage.getItem("ps2_ts")||0}catch(e){}
const save=isData=>{if(isData)localTs=Date.now();try{localStorage.setItem("ps2_data",JSON.stringify(data));localStorage.setItem("ps2_days",JSON.stringify(daysAll));localStorage.setItem("ps2_ts",String(localTs))}catch(e){}};
const effDays=id=>{const l=daysAll[id],p=daysPub[id];const base=Object.assign({},CFG.defaultDays,p||{});return l&&(!p||l.t>=pubTs)?Object.assign({},CFG.defaultDays,l):base};
const D=()=>effDays(cur.id);
const setDay=(k,v)=>{const e=effDays(cur.id);e[k]=v;e.t=Date.now();daysAll[cur.id]=e};
const colIdx=n=>(data[0]||[]).findIndex(h=>norm(h)===norm(n));
const getRow=(a=cur)=>{const i=colIdx("Agent Name");return i<0||!a?null:data.slice(1).find(r=>norm(r[i])===norm(a.name))};
// Percent fields: "93%" or 93 -> 0.93; a bare value of 1 or less is treated as already a fraction (1 = 100%).
function num(n,a=cur){const r=getRow(a),i=colIdx(n);if(!r||i<0)return NaN;const s=String(r[i]==null?"":r[i]).trim();if(!s)return NaN;let v=parseFloat(s.replace(/[$,%\s]/g,""));if(isNaN(v))return NaN;if(PCT.includes(norm(n))&&(s.includes("%")||v>1))v/=100;return v}
const ok=v=>!isNaN(v);
const P=v=>ok(v)?(v*100).toFixed(2)+"%":"—";   // every percentage shows 2 decimals
const P2=v=>ok(v)?(v*100).toFixed(2)+"%":"—";   // percent with 2 decimals
const N=(v,d=0)=>ok(v)?v.toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d}):"—";
const $=v=>ok(v)?"$"+N(v,2):"—";
const tier=(v,list,dir,last)=>{if(!ok(v))return NaN;for(const[t,s]of list){if(dir>0?v>=t:v<=t)return s}return last};
const sc={
aht:v=>tier(v,[[920,1],[930,.9],[939,.8],[949,.7],[959,.6]],-1,.5),
csat:v=>tier(v,[[4.96,1.1],[4.93,1],[4.89,.9],[4.85,.8]],1,.5),
trf:v=>tier(v,[[.12,1.1],[.129,1],[.139,.9],[.145,.8],[.149,.7]],-1,.5),
pay:v=>tier(v,[[.87,1.1],[.83,1],[.8,.9],[.77,.8],[.75,.7],[.73,.6]],1,.5)};
// VRR tiers by tenure group; every boundary is inclusive (>=)
const vrrScore=(v,k)=>{if(!ok(v))return NaN;
if(k==="t")return v>=.97?1.1:v>=.94?1:v>=.92?.9:v>=.9?.8:v>=.871?.7:.5;
if(k==="m")return v>=.93?1.1:v>=.9?1:v>=.88?.9:v>=.85?.8:v>=.82?.7:.5;
return v>=.91?1.1:v>=.87?1:v>=.85?.9:v>=.82?.8:v>=.801?.7:.5};
const vrrC=(v,a)=>!ok(v)?"":v<a.red?"miss":v<a.org?"orange":"";
const pcC=v=>!ok(v)?"":v<CFG.acqTarget?"miss":v<CFG.acqTarget+.5?"orange":"";
const below=(v,t)=>ok(v)&&v<t?"miss":"";
const above=(v,t)=>ok(v)&&v>t?"miss":"";
const xfC=v=>ok(v)&&v<CFG.xferSurveyRed?"red":"";
const row3=(a,b,c,m)=>`<tr${m?' class="'+m+'"':''}><td>${a}</td><td class="v">${b}</td>${c===undefined?"":`<td class="v">${c}</td>`}</tr>`;
const badge=q=>q===null?"—":`<span class="${q?"yes":"no"}">${q?"YES":"NO"}</span>`;
const kpiAmt=p=>{for(const[t,a]of CFG.kpiBands)if(p>=t)return a;return 0};

function render(){
if(!cur)return;
const days=D();
$id("agent").textContent=cur.name.toUpperCase();
$id("note").textContent=getRow()?"":"No data found for this agent yet. Ask your supervisor to load the latest data.";
const ans=num("Voice Answered"),aht=num("Voice Answered AHT"),csat=num("Voice CSAT"),fcr=num("Voice FCR"),res=num("Voice Agent Resolution"),take=num("Voice Answered Take Rate (calibrated)"),trf=num("Voice Answered Transfer to Survey % (calibrated)"),xfer=num("Voice Handled Transfer % (calibrated)"),pay=num("Status - Pay to Performance"),book=num("Revenue - Bookings (Post Recoup)"),acq=num("Revenue - ACQ + CROSS (Post Recoup)"),ren=num("Revenue - REN (Post Recoup)");
$id("mtd").innerHTML="<thead><tr><th>METRIC</th><th style='text-align:right'>SCORE</th></tr></thead><tbody>"+
row3("CALLS",N(ans))+row3("AHT",N(aht),undefined,above(aht,CFG.ahtTarget))+row3("CSAT",N(csat,2),undefined,below(csat,CFG.csatTarget))+row3("VRR",P(res),undefined,vrrC(res,cur))+row3("FCR",P(fcr))+row3("TAKE RATE",P(take),undefined,below(take,CFG.takeTarget))+row3("XFER TO SURVEY",P(trf),undefined,xfC(trf))+row3("TRANSFERS%",P(xfer),undefined,above(xfer,CFG.transferMax))+row3("P2P",P(pay),undefined,below(pay,CFG.p2pTarget))+"</tbody>";
const tot=ok(acq)&&ok(ren)?acq+ren:NaN,pc=ok(acq)&&ok(ans)&&ans?acq/ans:NaN;
const miss=ok(pc)?(pc<CFG.acqTarget?CFG.acqTarget*ans-acq:0):NaN;
let inc=NaN;if(ok(book)){inc=0;CFG.incentive.forEach(([k,v])=>{if(book>=k)inc=v})}
const kick=ok(book)?Math.round(Math.max(book-CFG.kicker.start,0)*CFG.kicker.rate*CFG.kicker.fx*100)/100:NaN;
const q1=ok(take)&&ok(csat)&&ok(pc)?(take>=CFG.takeTarget&&csat>=CFG.csatTarget&&pc>=CFG.acqTarget):null;
$id("sales").innerHTML="<thead><tr><th>METRIC</th><th style='text-align:right'>VALUE</th></tr></thead><tbody>"+
row3("ACQ",$(acq))+row3("RENEWAL",$(ren))+row3("TOTAL",$(tot))+
row3("$/CALL",$(pc),undefined,pcC(pc))+row3("Missing ACQ (target $"+CFG.acqTarget.toFixed(2)+"/call)",$(miss),undefined,below(pc,CFG.acqTarget))+row3("INCENTIVES",$(inc))+row3("KICKER",$(kick))+row3("QUALIFIED?",badge(q1))+"</tbody>";
const W=CFG.weights;
const s=[sc.aht(aht),sc.csat(csat),vrrScore(res,cur.key),sc.trf(xfer),sc.pay(pay)];
const abn=n=>n===0?1:n===1?.75:n===2?.5:0;
const pcnt=s.every(ok)?s[1]*W.csat+s[0]*W.aht+s[2]*W.vrr+s[4]*W.p2p+s[3]*W.transfer+abn(days.a)*W.absence+abn(days.l)*W.late:NaN;
const mult=days.s?Math.min(1,days.w/days.s):NaN;   // capped at 100%
const sp=v=>ok(v)?(v*100).toFixed(2)+"%":"—";
const ab=n=>sp(abn(n));
const pr=Math.round(pcnt*1e6)/1e6;
const initial=ok(pr)?kpiAmt(pr):NaN;
const q2=ok(pr)?initial>0:null;   // KPI qualified = reaches the lowest payout band
const ro=unlocked?"":" readonly";
const inp=(id,v)=>`<input class="edit" type="text" inputmode="decimal" id="${id}" value="${v}"${ro}>`;

/* CSAT data sheet */
function parseTSV(t){const rows=[];let row=[],f="",q=false;t=t.replace(/\r/g,"");
for(let i=0;i<t.length;i++){const ch=t[i];
 if(q){if(ch==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=ch}
 else if(ch==='"'&&f==="")q=true;
 else if(ch==="\t"){row.push(f);f=""}
 else if(ch==="\n"){row.push(f);rows.push(row);row=[];f=""}
 else f+=ch}
if(f!==""||row.length){row.push(f);rows.push(row)}
return rows}
const CS_CAP=1000;
function csGrid(){
const arr=cs[csTab],R=Math.min(arr.length+xRows,CS_CAP),C=Math.max(xCols,...arr.slice(0,CS_CAP).map(r=>r.length+1));
let h="<table><thead><tr><th></th>";
for(let k=0;k<C;k++)h+=`<th>${colName(k)}</th>`;
h+="</tr></thead><tbody>";
for(let r=0;r<R;r++){h+=`<tr><td class="n">${r+1}</td>`;for(let k=0;k<C;k++){const v=(arr[r]&&arr[r][k])||"";h+=`<td contenteditable="true" data-r="${r}" data-c="${k}">${String(v).replace(/&/g,"&amp;").replace(/</g,"&lt;")}</td>`}h+="</tr>"}
$id("csSheet").innerHTML=h+"</tbody></table>";
$id("csHint").textContent=(csTab==="surveys"?"Click A1 and paste the survey export (replaces old data), headers in row 1.":"Click A1 and paste Agent Name + Calls (or Voice Answered), headers in row 1.")+(arr.length>CS_CAP?" Showing first "+CS_CAP+" of "+arr.length+" rows.":"");
}
