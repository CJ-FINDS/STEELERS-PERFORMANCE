<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Progress Stat</title>
<style>
:root{--bg:#000;--card:#0b0b0b;--row:#1a1a1a;--text:#e6e6e6;--white:#dedede;--muted:#a3a3a3;--edge:rgba(255,255,255,.6);--soft:rgba(255,255,255,.22);--red:#9b2c2c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{height:100%}
body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--text);background:var(--bg)}
header{padding:28px 20px 8px;text-align:center;position:relative}
h1{margin:0;font-size:13px;letter-spacing:.3em;color:var(--muted)}
h2.agent{margin:6px 0 0;font-size:clamp(22px,4vw,34px);letter-spacing:.04em}
.switch{position:absolute;top:22px;right:20px;border:1px solid var(--edge);background:transparent;color:var(--text);border-radius:10px;padding:8px 14px;font-weight:700;font-size:12px;letter-spacing:.08em;cursor:pointer}
.switch:hover{background:var(--white);color:#000}
.note{max-width:1200px;margin:10px auto 0;padding:0 20px;text-align:center;font-size:13px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px;padding:16px 20px 100px;max-width:1200px;margin:auto}
.card{background:var(--card);border:1px solid var(--edge);border-radius:20px;padding:18px}
.card h3{margin:0 0 12px;font-size:15px;letter-spacing:.15em;color:var(--muted)}
table{width:100%;border-collapse:separate;border-spacing:0 6px}
td,th{padding:9px 12px;text-align:left;font-size:14px}
th{font-size:11px;letter-spacing:.1em;color:var(--muted);font-weight:600;padding-top:0;padding-bottom:0}
tbody td{background:var(--row)}tbody td:first-child{border-radius:10px 0 0 10px}tbody td:last-child{border-radius:0 10px 10px 0}
td.v{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.yes,.no{display:inline-block;padding:3px 12px;border-radius:99px;font-weight:800;font-size:13px}
.yes{background:#22c55e;color:#04210f}.no{background:var(--red);color:var(--text)}
tr.miss td,tr.red td{background:var(--red);color:var(--text)}
tr.orange td{background:#f97316;color:#000}
.edit{width:70px;text-align:right;font:inherit;font-weight:700;color:var(--text);background:#000;border:1px solid var(--edge);border-radius:8px;padding:3px 6px}
.edit[readonly]{border-color:var(--soft);cursor:pointer}
.fab{position:fixed;right:max(20px,env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;border:1px solid #000;background:var(--white);color:#000;font-size:26px;cursor:pointer;box-shadow:0 8px 28px rgba(255,255,255,.18)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;padding:16px;z-index:5}
.modal.on{display:flex}
#pwModal{z-index:30}
#picker{z-index:20;background:#000;overflow:auto;align-items:flex-start}
.panel{background:var(--card);border:1px solid var(--edge);border-radius:20px;width:min(1100px,100%);max-height:88vh;display:flex;flex-direction:column;padding:16px;color:var(--text)}
.bar{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-bottom:10px;flex-wrap:wrap}
.bar b{font-size:15px}.bar small{opacity:.75}
.bar button,.pwbtns button{border:1px solid var(--edge);border-radius:10px;padding:8px 14px;font-weight:700;cursor:pointer;background:var(--white);color:#000;margin-left:6px}
.bar button#clear,.bar button#export,.bar button#csExport,.bar button#csClear,.bar button.ghostb,.pwbtns button.ghost{background:transparent;color:var(--text)}
.sheet{overflow:auto;border-radius:10px;background:var(--white)}
.sheet table{border-collapse:collapse;border-spacing:0;width:max-content;color:#111}
.sheet td,.sheet th{border:1px solid #d4d4d4;padding:4px 8px;font-size:12.5px;min-width:90px;height:26px;white-space:nowrap;background:var(--white)}
.sheet th{background:#cfcfcf;color:#111;text-align:center;position:sticky;top:0}
.sheet td.n{background:#cfcfcf;color:#111;min-width:34px;text-align:center;position:sticky;left:0}
.sheet tr:first-of-type td:not(.n){font-weight:700;background:#d4d4d4}
.sheet td:focus{outline:2px solid #000;outline-offset:-2px}
.pick{width:min(760px,100%);margin:max(6vh,76px) auto 40px;text-align:center}
.pick h2{margin:10px 0 6px;font-size:clamp(24px,5vw,36px);letter-spacing:.04em}
.grp{margin-bottom:22px;text-align:left}
.grp h4{margin:0 0 10px;font-size:12px;letter-spacing:.2em;color:var(--muted);border-bottom:1px solid var(--soft);padding-bottom:8px}
.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.names button{font:inherit;font-weight:700;font-size:14px;text-align:left;color:var(--text);background:var(--card);border:1px solid var(--edge);border-radius:12px;padding:13px 14px;cursor:pointer}
.names button:hover{background:var(--white);color:#000}
#lb,#ts,#csat{z-index:20;background:#000;overflow:auto;align-items:flex-start}
.lbwrap{width:min(1200px,100%);margin:3vh auto 40px}
.lbtop{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
.lbtop h2{margin:0;font-size:clamp(22px,4vw,32px);letter-spacing:.06em}
.lbsec{grid-column:1/-1;font-size:12px;letter-spacing:.2em;color:var(--muted);border-bottom:1px solid var(--soft);padding-bottom:8px;margin-top:8px}
.lbgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px;padding:14px 0}
.lbgrid td:first-child{width:36px;text-align:center}
#tsGrid td:first-child{white-space:nowrap}
/* Background logo: put bg.png next to index.html. Change --bgop to make it fainter (lower) or stronger (higher). */
:root{--bgop:.15}
body::before,#picker::before,#lb::before,#ts::before,#csat::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:url("IMAGE/bg.png") center/min(75vmin,640px) no-repeat;opacity:var(--bgop)}
.switch.left{left:20px;right:auto}
/* Attention shake for the SWITCH CSAT VIEW buttons: shakes on load, then every 1.5s */
@keyframes shake{0%{transform:translateX(0)}4%{transform:translateX(-6px)}8%{transform:translateX(6px)}12%{transform:translateX(-6px)}16%{transform:translateX(6px)}20%{transform:translateX(-3px)}24%{transform:translateX(3px)}28%,100%{transform:translateX(0)}}
#toCsat,#toCsat2{animation:shake 1.5s ease-in-out infinite}
#toCsat:hover,#toCsat2:hover{animation:none}
@media (prefers-reduced-motion:reduce){#toCsat,#toCsat2{animation:none}}
#csModal{z-index:25}
#csat .lbwrap{padding-bottom:90px}
.csTitle{margin:6px 0 4px;text-align:center;font-size:clamp(22px,4vw,32px);letter-spacing:.06em}
.csgrid{display:grid;gap:18px;padding:14px 0}
.scroll{overflow-x:auto}
.cst{min-width:640px}.cst.wide{min-width:980px}
.cst th{text-align:center;vertical-align:bottom;padding:0 12px 6px;white-space:normal;min-width:90px;line-height:1.3}
.cst th:first-child{min-width:170px}
.cst td,.cst td.v{text-align:center}
.cst td:first-child{white-space:nowrap}
.cst td.bad{background:var(--red);color:var(--text)}
.cst tr.gt td{background:var(--white);color:#000;font-weight:800}
.cst tr.gt td.bad{background:var(--red);color:var(--text)}
.tg{display:block;font-size:10px;letter-spacing:.12em;opacity:.7;font-weight:600}
.lbbtns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-bottom:26px}
.lbbtn{font:inherit;font-weight:800;font-size:15px;letter-spacing:.16em;color:#000;background:var(--white);border:1px solid var(--white);border-radius:12px;padding:14px 28px;cursor:pointer}
.lbbtn:hover{background:#000;color:var(--text);border-color:var(--edge)}
.empty{color:var(--muted);font-size:14px;padding:10px 0}
#pwIn{width:100%;font:inherit;font-size:16px;color:var(--text);background:#000;border:1px solid var(--edge);border-radius:10px;padding:11px 12px;margin:12px 0 6px}
#pwErr{min-height:20px;font-size:13px;color:#ff6b6b;font-weight:700}
.pwbtns{display:flex;justify-content:flex-end;margin-top:8px}
@media(max-width:560px){.switch{position:static;margin-bottom:10px}}
/* SEE DIFFICULTIES view */
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px}
.qtog{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.qtog button{font:inherit;font-weight:800;font-size:12px;letter-spacing:.12em;color:var(--text);background:transparent;border:1px solid var(--edge);border-radius:10px;padding:9px 16px;cursor:pointer}
.qtog button.on{background:var(--white);color:#000}
.bars{display:flex;gap:10px;align-items:flex-end}
.bar2{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;background:transparent;border:1px solid transparent;border-radius:12px;padding:8px 4px;cursor:pointer;color:var(--text);font:inherit}
.bar2:hover{border-color:var(--soft)}
.bar2.sel{border-color:var(--edge);background:var(--row)}
.bar2 .bn{font-weight:800;font-size:15px;font-variant-numeric:tabular-nums}
.bar2 .bf{width:100%;max-width:70px;background:#6b6b6b;border-radius:8px 8px 0 0;min-height:2px}
.bar2.bad .bf{background:var(--red)}
.bar2.g5 .bf{background:#22c55e}
.bar2.g45 .bf{background:#86efac}
.bar2{border-color:var(--soft);transition:background .15s,border-color .15s,transform .15s}
.bar2:hover{border-color:var(--edge);background:var(--row);transform:translateY(-3px)}
.bar2:active{transform:translateY(0)}
.bar2.sel{border-color:#fff;background:var(--row)}
.hint{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--text);margin:0 0 12px}
.hint::before{content:"👆";font-size:16px}
.bar2 .bl{font-size:12px;font-weight:700;text-align:center;line-height:1.25;color:var(--muted);min-height:64px;display:flex;align-items:flex-start;justify-content:center}
.bar2.sc .bl{min-height:0;font-size:13px;color:var(--text)}
.dr .catrow td{background:var(--white);color:#000;font-weight:800}
.dr .subrow td:first-child{padding-left:28px}
</style></head><body>
<header>
<button class="switch left" id="toCsat">SEE DIFFICULTIES</button>
<button class="switch" id="switch">SWITCH AGENT</button>
<h1>PROGRESS STAT</h1><h2 class="agent" id="agent"></h2>
</header>
<div class="note" id="note"></div>
<div class="grid">
<div class="card"><h3>MTD TABLE</h3><table id="mtd"></table></div>
<div class="card"><h3>SALES TABLE</h3><table id="sales"></table></div>
<div class="card"><h3>KPI TABLE</h3><table id="kpi"></table></div>
</div>
<button class="fab" id="fab" title="Open data sheet" aria-label="Open data sheet">&#128214;</button>

<div class="modal" id="lb"><div class="lbwrap">
<div class="lbtop"><h2>OUTLIERS</h2><button class="switch" id="lbBack" style="position:static">BACK</button></div>
<div class="lbgrid" id="lbGrid"></div>
</div></div>

<div class="modal" id="ts"><div class="lbwrap">
<div class="lbtop"><h2>TEAM SCORES</h2><button class="switch" id="tsBack" style="position:static">BACK</button></div>
<div class="note" id="tsNote" style="text-align:left;padding:0;margin:0 0 4px"></div>
<div class="lbgrid" id="tsGrid"></div>
</div></div>

<div class="modal on" id="picker"><button class="switch left" id="toCsat2" style="position:fixed;top:calc(22px + env(safe-area-inset-top,0px));left:20px">SEE DIFFICULTIES</button><div class="pick">
<h1>PROGRESS STAT</h1>
<h2>STEELERS MTD</h2>
<div class="lbbtns"><button class="lbbtn" id="lbBtn">VIEW OUTLIERS</button><button class="lbbtn" id="tsBtn">VIEW TEAM SCORES</button></div>
<div id="groups"></div>
</div></div>

<div class="modal" id="csat"><div class="lbwrap">
<div class="lbtop"><button class="switch" id="csBack" style="position:static">SWITCH PROGRESS VIEW</button></div>
<h2 class="csTitle">SEE DIFFICULTIES</h2>
<div class="note" id="csNote"></div>
<div class="csgrid" id="csTables"></div>
<button class="fab" id="csFab" title="Open data sheet" aria-label="Open data sheet">&#128214;</button>
</div></div>

<div class="modal" id="csModal"><div class="panel">
<div class="bar"><div><b>Survey data</b> <small id="csHint"></small></div>
<div><button id="csAddRows" class="ghostb">+ Rows</button><button id="csAddCols" class="ghostb">+ Cols</button><button id="csExport" title="Download difficulties.json to publish for everyone">Export data</button><button id="csClear">Clear</button><button id="csClose">Done</button></div></div>
<div class="sheet" id="csSheet"></div></div></div>

<div class="modal" id="pwModal"><div class="panel" style="width:min(380px,100%)">
<b>Password required</b>
<small style="opacity:.75;margin-top:4px">Enter the password to edit or paste data.</small>
<input id="pwIn" type="password" placeholder="Password" autocomplete="off">
<div id="pwErr"></div>
<div class="pwbtns"><button class="ghost" id="pwCancel">Cancel</button><button id="pwOk">Unlock</button></div>
</div></div>

<div class="modal" id="modal"><div class="panel">
<div class="bar"><div><b>Data sheet</b> <small>Click cell A1 and paste (Ctrl+V); pasting at A1 replaces all old data. Headers in row 1</small></div>
<div><button id="addRows" class="ghostb">+ Rows</button><button id="addCols" class="ghostb">+ Cols</button><button id="export" title="Download data.json to publish for all agents">Export data</button><button id="clear">Clear</button><button id="close">Done</button></div></div>
<div class="sheet" id="sheet"></div></div></div>

<script>
/* ================= CONFIG: edit values here ================= */
// Password is stored as a hash, not plain text. To change it, run in the browser console:
// hash("YourNewPassword") and paste the number below. (Still client-side only: it gates the UI, not the data.)
const PW_HASH=1692183746526809;
const hash=(s,seed=0)=>{let h1=0xdeadbeef^seed,h2=0x41c6ce57^seed;for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677)}
h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return 4294967296*(2097151&h2)+(h1>>>0)};
const CFG={
 takeTarget:.36, vrrRed:.92, passRateTarget:.6, fcrPassTarget:.88, acqTarget:5.85, csatTarget:4.9, p2pTarget:.85, fcrTarget:.85, ahtTarget:920, xferSurveyRed:.55, transferMax:.12,
 defaultDays:{w:22,s:22,a:0,l:0},
 // Incentive: bookings threshold -> payout
 incentive:[[500,1750],[1000,3250],[2000,4750],[3000,5000],[3500,5100],[4000,5250],[4500,5750],[5000,6250],[5500,6500],[6000,7000],[6500,7500],[7000,8000]],
 kicker:{start:7000,rate:.035,fx:60.59},
 // KPI payout bands: minimum percentage -> amount (highest first)
 kpiBands:[[.95,5250],[.9,5000],[.87,4500],[.85,2500],[.8,1975]],
 // KPI weights
 weights:{csat:.2,aht:.25,vrr:.25,p2p:.15,transfer:.05,absence:.05,late:.05}
};
/* ============================================================ */
const GROUPS=[
{label:"TENURED AGENTS",short:"TENURED",key:"t",red:.94,org:.97,names:["Chino Albarracin","Blessy Anne Opamin","Kint Mabayo","Dean John Mawili","Gestoni Cobar"]},
{label:"31-90 DAYS",short:"31-90 DAYS",key:"m",red:.91,org:.93,names:["Rommel Gepitulan","Joann Paler","Carla Lynn Lanada","Archellie Recinto","Dinece Ambra Estella","Julie Luz Baloy","Justine Bustillon","Bill Christian Llevares"]},
{label:"BELOW 30 DAYS",short:"BELOW 30 DAYS",key:"n",red:.87,org:.91,names:["Jade Cabiles","Mark Montano","Jag Vosotros"]}];
const HDR=["Agent Name","Voice Answered","Voice Answered AHT","Voice CSAT","Voice FCR","Voice Agent Resolution","Voice Answered Take Rate (calibrated)","Voice Answered Transfer to Survey % (calibrated)","Voice Handled Transfer % (calibrated)","Status - Pay to Performance","Voice Sentiment Trend Avg","Revenue - Bookings (Post Recoup)","Revenue - ACQ + CROSS (Post Recoup)","Revenue - REN (Post Recoup)"];
const PCT=["voicefcr","voiceagentresolution","voiceansweredtakeratecalibrated","voiceansweredtransfertosurveycalibrated","voicehandledtransfercalibrated","statuspaytoperformance"];
const norm=s=>String(s==null?"":s).toLowerCase().replace(/[^a-z0-9]/g,"");
const AGENTS=GROUPS.flatMap(g=>g.names.map(n=>({name:n,id:norm(n),key:g.key,red:g.red,org:g.org,tag:g.short})));
const $id=id=>document.getElementById(id);
let cur=null,unlocked=false,pwThen=null;
let data=[HDR.slice()],daysAll={},daysPub={},pubTs=0,localTs=0;
try{const d=JSON.parse(localStorage.getItem("ps2_data")||"null");if(d&&d.length)data=d;const k=JSON.parse(localStorage.getItem("ps2_days")||"null");if(k)daysAll=k;localTs=+localStorage.getItem("ps2_ts")||0}catch(e){}
const save=isData=>{if(isData)localTs=Date.now();try{localStorage.setItem("ps2_data",JSON.stringify(data));localStorage.setItem("ps2_days",JSON.stringify(daysAll));localStorage.setItem("ps2_ts",String(localTs))}catch(e){}};
const effDays=id=>{const l=daysAll[id],p=daysPub[id];const base=Object.assign({},CFG.defaultDays,p||{});return l&&(!p||l.t>=pubTs)?Object.assign({},CFG.defaultDays,l):base};
const D=()=>effDays(cur.id);
const setDay=(k,v)=>{const e=effDays(cur.id);e[k]=v;e.t=Date.now();daysAll[cur.id]=e};
const colIdx=n=>(data[0]||[]).findIndex(h=>norm(h)===norm(n));
const getRow=(a=cur)=>{const i=colIdx("Agent Name");return i<0||!a?null:data.slice(1).find(r=>norm(r[i])===norm(a.name))};
// Percent fields: "93%" or 93 -> 0.93; a bare value of 1 or less is treated as already a fraction (1 = 100%).
function num(n,a=cur){const r=getRow(a),i=colIdx(n);if(!r||i<0)return NaN;const s=String(r[i]==null?"":r[i]).trim();if(!s)return NaN;let v=parseFloat(s.replace(/[$,%\s]/g,""));if(isNaN(v))return NaN;if(PCT.includes(norm(n))&&(s.includes("%")||v>1))v/=100;return v}
const ok=v=>!isNaN(v);
const P=v=>ok(v)?(v*100).toFixed(2)+"%":"—";   // every percentage shows 2 decimals
const N=(v,d=0)=>ok(v)?v.toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d}):"—";
const $=v=>ok(v)?"$"+N(v,2):"—";
const tier=(v,list,dir,last)=>{if(!ok(v))return NaN;for(const[t,s]of list){if(dir>0?v>=t:v<=t)return s}return last};
const sc={
aht:v=>tier(v,[[920,1],[930,.9],[939,.8],[949,.7],[959,.6]],-1,.5),
csat:v=>tier(v,[[4.96,1.1],[4.93,1],[4.89,.9],[4.85,.8]],1,.5),
trf:v=>tier(v,[[.12,1.1],[.129,1],[.139,.9],[.145,.8],[.149,.7]],-1,.5),
pay:v=>tier(v,[[.87,1.1],[.83,1],[.8,.9],[.77,.8],[.75,.7],[.73,.6]],1,.5)};
// VRR tiers by tenure group; every boundary is inclusive (>=)
const vrrScore=(v,k)=>{if(!ok(v))return NaN;
if(k==="t")return v>=.97?1.1:v>=.94?1:v>=.92?.9:v>=.9?.8:v>=.871?.7:.5;
if(k==="m")return v>=.93?1.1:v>=.9?1:v>=.88?.9:v>=.85?.8:v>=.82?.7:.5;
return v>=.91?1.1:v>=.87?1:v>=.85?.9:v>=.82?.8:v>=.801?.7:.5};
const vrrC=(v,a)=>!ok(v)?"":v<a.red?"miss":v<a.org?"orange":"";
const pcC=v=>!ok(v)?"":v<CFG.acqTarget?"miss":v<CFG.acqTarget+.5?"orange":"";
const below=(v,t)=>ok(v)&&v<t?"miss":"";
const above=(v,t)=>ok(v)&&v>t?"miss":"";
const p2pC=v=>ok(v)&&v<CFG.p2pTarget?"miss":"";   // P2P: red only when below 85%
const xfC=v=>ok(v)&&v<CFG.xferSurveyRed?"red":"";
const row3=(a,b,c,m)=>`<tr${m?' class="'+m+'"':''}><td>${a}</td><td class="v">${b}</td>${c===undefined?"":`<td class="v">${c}</td>`}</tr>`;
const badge=q=>q===null?"—":`<span class="${q?"yes":"no"}">${q?"YES":"NO"}</span>`;
const kpiAmt=p=>{for(const[t,a]of CFG.kpiBands)if(p>=t)return a;return 0};

function render(){
if(!cur)return;
const days=D();
$id("agent").textContent=cur.name.toUpperCase();
$id("note").textContent=getRow()?"":"No data found for this agent yet. Ask your supervisor to load the latest data.";
const ans=num("Voice Answered"),aht=num("Voice Answered AHT"),csat=num("Voice CSAT"),fcr=num("Voice FCR"),res=num("Voice Agent Resolution"),take=num("Voice Answered Take Rate (calibrated)"),trf=num("Voice Answered Transfer to Survey % (calibrated)"),xfer=num("Voice Handled Transfer % (calibrated)"),pay=num("Status - Pay to Performance"),book=num("Revenue - Bookings (Post Recoup)"),acq=num("Revenue - ACQ + CROSS (Post Recoup)"),ren=num("Revenue - REN (Post Recoup)");

function parseTSV(t){const rows=[];let row=[],f="",q=false;t=t.replace(/\r/g,"");
for(let i=0;i<t.length;i++){const ch=t[i];
 if(q){if(ch==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=ch}
 else if(ch==='"'&&f==="")q=true;
 else if(ch==="\t"){row.push(f);f=""}
 else if(ch==="\n"){row.push(f);rows.push(row);row=[];f=""}
 else f+=ch}
if(f!==""||row.length){row.push(f);rows.push(row)}
return rows}
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");
const FCR_LABELS=["Yes. resolved in one interaction","Yes. but it took more than one interaction.","No. this is my first interaction and it is not resolved.","No. I have contacted you more than once and it is still not resolved."];
const FCRN=FCR_LABELS.map(norm);
let cs={rows:[]},csLocalTs=0,csSel=null;
try{const d=JSON.parse(localStorage.getItem("ps_diff")||"null");if(d){cs.rows=d.rows||[];csLocalTs=+d.ts||0}}catch(e){}
const csSave=()=>{csLocalTs=Date.now();try{localStorage.setItem("ps_diff",JSON.stringify({rows:cs.rows,ts:csLocalTs}))}catch(e){}};

// Finds each needed column by header name (exact aliases first, then a partial match)
function csCols(){const h=(cs.rows[0]||[]).map(norm);
const f=(ex,part)=>{let i=-1;for(const k of ex){i=h.indexOf(k);if(i>=0)return i}if(part)i=h.findIndex(x=>x.includes(part));return i};
return{pega:f(["pegacase","pegacaseid","pegacasenumber","pegaid","caseid","case"],"pegacase"),
 k:f(["q1knowledge","knowledgeablerating","knowledgeable"],"knowledg"),
 c:f(["q2courtesy","courteousrating","courteous"],"courte"),
 fcr:f(["q3fcr","fcrvalue","fcr"],"fcr"),
 cat:f(["pegacategory","category","casecategory"]),
 sub:f(["pegasubcategory","subcategory","subcat","casesubcategory"])}}
function csRecs(){const C=csCols(),out=[];
for(let r=1;r<cs.rows.length;r++){const row=cs.rows[r]||[];if(!row.some(x=>String(x||"").trim()))continue;
 const sc=i=>{const v=Math.round(parseFloat(row[i]));return v>=1&&v<=5?v:0};
 out.push({id:C.pega>=0&&norm(row[C.pega])?norm(row[C.pega]):"r"+r,
  k:C.k>=0?sc(C.k):0,c:C.c>=0?sc(C.c):0,
  a:0,
  f:C.fcr>=0?FCRN.indexOf(norm(row[C.fcr])):-1,
  cat:(C.cat>=0&&String(row[C.cat]||"").trim())||"(blank)",
  sub:(C.sub>=0&&String(row[C.sub]||"").trim())||"(blank)"})}
out.forEach(r=>{r.a=r.k&&r.c?(r.k+r.c)/2:r.k||r.c||0});   // CSAT of one survey = average of the Knowledge and Courtesy scores it has (one score alone counts as is)
return{C,out}}

function csRender(){
const{C,out:all}=csRecs();
const out=all.filter(r=>r.a),noAvg=all.length-out.length;   // a row with neither score is not a survey and is skipped
const miss=[["Knowledgeable rating",C.k],["Courteous rating",C.c],["FCR value",C.fcr],["Category",C.cat],["Sub category",C.sub],["Pega case",C.pega]].filter(x=>x[1]<0).map(x=>x[0]);
$id("csNote").textContent=cs.rows.length<=1?"No data yet. Tap the book button and paste the sheet at A1 (headers in row 1).":miss.length?"Columns not found: "+miss.join(", ")+". Check the header names in row 1.":noAvg?noAvg+" row(s) skipped: no Knowledge or Courtesy score.":"";

const chart=(bars,title,sub)=>{const mx=Math.max(1,...bars.map(b=>b.n));
 return`<div class="card"><h3>${title}</h3><div class="note" style="padding:0;text-align:left;margin:0 0 8px">${sub}</div><div class="hint">TAP A BAR TO SEE ITS CATEGORIES</div><div class="bars">`+

let drill='<div class="card dr" id="drill"><div class="empty">Tap a bar to see the categories and sub categories behind it.</div></div>';
if(csSel){
 let rows,title;
 if(csSel[0]==="s"){const s=+csSel.slice(1);rows=out.filter(r=>r.a===s);title="CSAT "+s}
 else{rows=out.filter(r=>r.f===+csSel.slice(1));title=FCR_LABELS[+csSel.slice(1)]}
 const cats={};
 rows.forEach(r=>{const c=cats[r.cat]||(cats[r.cat]={all:new Set(),subs:{}});c.all.add(r.id);(c.subs[r.sub]||(c.subs[r.sub]=new Set())).add(r.id)});

 let h=`<table><thead><tr><th>CATEGORY / SUB CATEGORY</th><th style="text-align:right">PEGA CASES</th><th style="text-align:right">SHARE</th></tr></thead><tbody>`;
 Object.entries(cats).sort((a,b)=>b[1].all.size-a[1].all.size).forEach(([c,o])=>{
  h+=`<tr class="catrow"><td>${esc(c)}</td><td class="v">${o.all.size}</td><td class="v">${pct(o.all.size)}</td></tr>`;
  Object.entries(o.subs).sort((a,b)=>b[1].size-a[1].size).forEach(([s,set])=>{h+=`<tr class="subrow"><td>${esc(s)}</td><td class="v">${set.size}</td><td class="v">${pct(set.size)}</td></tr>`})});
 drill=`<div class="card dr" id="drill"><h3>${esc(title)} · ${total} PEGA CASES</h3>${total?h+"</tbody></table>":'<div class="empty">No cases.</div>'}</div>`}
$id("csTables").innerHTML=`<div class="two">`+
 chart(csatBars,"CSAT SCORES","Average of Knowledge and Courtesy per survey. Red = DSAT (4 and below), green = 4.5 and 5.")+
 chart(fcrBars,"FCR","Green = resolved. Red = still not resolved.")+
 `</div>`+drill;
}

/* ---------- Data sheet ---------- */
let xRows=30,xCols=40;   // blank rows / minimum columns shown in the sheets; the + buttons grow them
const colName=c=>{let s="";c++;while(c>0){const m=(c-1)%26;s=String.fromCharCode(65+m)+s;c=Math.floor((c-1)/26)}return s};
function grid(){
const R=data.length+xRows,C=Math.max(xCols,...data.map(r=>r.length+1));
let h="<table><thead><tr><th></th>";
for(let c=0;c<C;c++)h+=`<th>${colName(c)}</th>`;
h+="</tr></thead><tbody>";
for(let r=0;r<R;r++){h+=`<tr><td class="n">${r+1}</td>`;for(let c=0;c<C;c++){const v=(data[r]&&data[r][c])||"";h+=`<td contenteditable="true" data-r="${r}" data-c="${c}">${String(v).replace(/&/g,"&amp;").replace(/</g,"&lt;")}</td>`}h+="</tr>"}
$id("sheet").innerHTML=h+"</tbody></table>";
}
const sheet=$id("sheet"),modal=$id("modal");
sheet.addEventListener("input",e=>{if(!unlocked)return;const t=e.target;if(!t.dataset||t.dataset.r===undefined)return;const r=+t.dataset.r,c=+t.dataset.c;while(data.length<=r)data.push([]);data[r][c]=t.textContent;save(true)});
sheet.addEventListener("paste",e=>{
const t=e.target.closest("td[data-r]");if(!t)return;e.preventDefault();
if(!unlocked){askPw();return}
const txt=(e.clipboardData||window.clipboardData).getData("text");
const rows=parseTSV(txt);
const r0=+t.dataset.r,c0=+t.dataset.c;
if(r0===0&&c0===0)data=[];
rows.forEach((cells,i)=>{while(data.length<=r0+i)data.push([]);cells.forEach((v,j)=>{data[r0+i][c0+j]=v.trim()})});
save(true);grid()});
const closeSheet=()=>{modal.classList.remove("on");render()};
$id("fab").onclick=()=>{askPw(()=>{grid();modal.classList.add("on");render()})};
$id("close").onclick=closeSheet;
const grow=(el,redraw,r,c)=>{const t=el.scrollTop,l=el.scrollLeft;xRows+=r;xCols+=c;redraw();el.scrollTop=t;el.scrollLeft=l};
$id("addRows").onclick=()=>grow(sheet,grid,25,0);
$id("addCols").onclick=()=>grow(sheet,grid,0,10);
$id("clear").onclick=()=>{if(!unlocked)return askPw();if(!confirm("Clear ALL pasted data for every agent?"))return;data=[[]];save(true);grid()};
modal.addEventListener("click",e=>{if(e.target===modal)closeSheet()});

function exportDays(){const ids=new Set([...Object.keys(daysPub),...Object.keys(daysAll)]),o={};ids.forEach(id=>{const e=effDays(id);delete e.t;o[id]=e});return o}
function doExport(){
const blob=new Blob([JSON.stringify({updated:Date.now(),data:data,days:exportDays()})],{type:"application/json"});
const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="data.json";document.body.appendChild(a);a.click();a.remove();
setTimeout(()=>URL.revokeObjectURL(a.href),1000);
alert("data.json downloaded.\n\nUpload it to your GitHub repo (same folder as index.html) and replace the old data.json. Agents will see the update after a few minutes.");
}
$id("export").onclick=()=>unlocked?doExport():askPw(doExport);

/* ---------- Published data (data.json next to index.html) ---------- */
function loadPublished(){
if(location.protocol==="file:")return;
fetch("data.json?v="+Date.now(),{cache:"no-store"}).then(r=>r.ok?r.json():null).then(j=>{
if(!j||!Array.isArray(j.data)||!j.data.length)return;
daysPub=j.days||{};pubTs=+j.updated||0;
if(pubTs>=localTs)data=j.data;
if(cur&&!$id("modal").classList.contains("on"))render();
if($id("lb").classList.contains("on"))renderLB();
if($id("ts").classList.contains("on"))renderTS();
}).catch(()=>{});
}

route();
loadPublished();
loadCsat();
</script></body></html>
